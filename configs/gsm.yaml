pipeline:
  steps:
    - extract_train
    - extract_eval
    - build_index
    - evaluate
  seed: 7
model:
  name: gpt2
  device: auto
  dtype: float32
generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  do_sample: false
prompt:
  template: "{question}\nAnswer:"
  strip_response: true
data:
  train:
    path: data/gsm_train.json
    cache: outputs/gsm_train_latents.jsonl
    limit: 50000
  eval:
    path: data/gsm_test.json
    cache: outputs/gsm_valid_latents.jsonl
    limit: null
index:
  train_cache: outputs/gsm_train_latents.jsonl
  index_path: outputs/gsm_train.faiss
  metadata_path: outputs/gsm_train.faiss.meta.json
  k: 5
  normalize: true
  weighting: softmax
  temperature: 0.1
  base_prior: 0.1
  min_confidence: 0.0
  override_threshold: 0.4
  gate:
    enabled: false
    state_path: outputs/gsm_gate.joblib
    dataset_path: outputs/gsm_gate_dataset.jsonl
output:
  metrics_path: outputs/gsm_metrics.json
  flips_path: outputs/gsm_flips.jsonl
  predictions_path: outputs/gsm_predictions.jsonl
