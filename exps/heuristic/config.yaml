dataset: data/gsm_train.json
model_checkpoint: data/checkpoints/gsm/gsm-coconut
model_id: openai-community/gpt2
run_id: heuristic_base
max_examples: 30000
max_new_tokens: 128
num_latent_thoughts: 8
heuristic_memory:
  latent_dim: 768
  key_dim: 64
  value_dim: 128
  index_path: data/checkpoints/gsm/faiss_lean/index.faiss
  metadata_path: data/checkpoints/gsm/faiss_lean/metadata.pt
  weights_path: data/checkpoints/gsm/faiss_lean/nudge.pt
  min_similarity: 0.9
  gate_threshold: 0.5
  lr: 0.0003
  max_entries: 512
  add_if_correct: true
