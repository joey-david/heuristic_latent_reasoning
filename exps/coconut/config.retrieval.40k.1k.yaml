dataset: data/gsm_test.json
train_dataset: data/gsm_train.json
model_checkpoint: data/checkpoints/gsm/gsm-coconut
model_id: openai-community/gpt2
run_id: coconut-retrieval-40k-1k
max_examples: 1000
max_new_tokens: 160
c_thought: 2
max_latent_stage: 3
latent_stage: null
latent_tokens: null
dry_run: false
retrieval:
  enabled: true
  train_cache: outputs/coconut40k/coconut_train_latents.jsonl
  index_path: outputs/coconut40k/coconut_train.faiss
  metadata_path: outputs/coconut40k/coconut_train.faiss.meta.json
  max_cache_examples: 40000
  k: 10
  normalize: true
  temperature: 0.3
  alpha: 1.0
  threshold: 0.995

