dataset: data/gsm_test.json
train_dataset: data/gsm_train.json
model_checkpoint: data/checkpoints/gsm/gsm-coconut
model_id: openai-community/gpt2
run_id: gsm8k-coconut-eval
max_examples: 5000
max_new_tokens: 160
c_thought: 2
max_latent_stage: 3
latent_stage: null
latent_tokens: null
dry_run: false
retrieval:
  enabled: true
  train_cache: outputs/coconut_train_latents.jsonl
  index_path: outputs/coconut_train.faiss
  metadata_path: outputs/coconut_train.faiss.meta.json
  k: 5
  normalize: true
  temperature: 0.1
  alpha: 0.5
  threshold: 0.2
